<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1b1b19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernplaner">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Lernplaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study tool, calm and dense, like a well-made planner app
   IDEA a paper semester planner: half-day blocks per course, coloured like highlighter tabs
   PICTURE the half-day week grid itself, coloured by course, exams as outlined tabs
   COLOUR warm near-black ground, off-white ink, one course colour each, green/yellow/red only for feedback
   TYPE Inter Tight for titles and figures, Inter for everything else
   LAYOUT header + tabs, title, allocation row, then the week grid full width; phone: same grid, short course codes */
:root{color-scheme:dark;--bg:#1b1b19;--p1:#242421;--p2:#2e2d29;--line:#3c3b35;--ink:#f1efe8;--mute:#aaa69b;--faint:#77736a;--acc:#7ea6f4;--pri:#2f5fb8;--good:#7cc68b;--mid:#e2c15c;--bad:#ea7668}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.02em;line-height:1.08;margin:0}
h1{font-size:clamp(30px,4vw,42px)}
h2{font-size:21px}
h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:10px max(3vw,16px) 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font:700 18px "Inter Tight",sans-serif;letter-spacing:-.02em;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand i{display:inline-grid;grid-template-columns:1fr 1fr;gap:2px;width:18px}
.brand i b{height:8px;border-radius:2px}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--p2);color:var(--mute);white-space:nowrap}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);white-space:nowrap}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.ok b{background:var(--good)}.sync.err b{background:var(--bad)}.sync.busy b{background:var(--mid)}
.mini{font:600 13px Inter,system-ui,sans-serif;color:var(--ink);background:var(--p2);border-radius:99px;padding:4px 10px;border:0;font-variant-numeric:tabular-nums}
.nav{max-width:1240px;margin:0 auto;padding:6px max(3vw,16px) 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav a{flex:none;padding:9px 12px 11px;color:var(--mute);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.nav a.on{color:var(--ink);border-color:var(--ink)}
.nav a span{font-size:12px;color:var(--faint);margin-left:4px}
main{max-width:1240px;margin:0 auto;padding:24px max(3vw,16px) 80px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.sub{color:var(--mute);margin:6px 0 0}
.btn{border:1px solid var(--line);background:var(--p1);border-radius:9px;padding:9px 14px;min-height:40px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--p2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:#3a6dca}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--mute)}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--mute)}.faint{color:var(--faint)}.small{font-size:13px}
.num{font-family:"Inter Tight",sans-serif;font-variant-numeric:tabular-nums}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--p2);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:14px}
.banner p{margin:0;flex:1 1 260px}
/* timeline */
.tl{position:relative;height:46px;margin:4px 0 18px}
.tl .rail{position:absolute;left:0;right:0;top:26px;height:6px;border-radius:9px;background:var(--p2)}
.tl .done{position:absolute;left:0;top:26px;height:6px;border-radius:9px;background:var(--faint)}
.tl .ex{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;white-space:nowrap}
.tl .ex i{width:12px;height:12px;border-radius:50%;margin-top:3px;border:2px solid var(--bg)}
.tl .now{position:absolute;top:20px;width:2px;height:18px;background:var(--ink);transform:translateX(-50%)}
.tl .ends{position:absolute;top:36px;left:0;right:0;display:flex;justify-content:space-between;font-size:12px;color:var(--faint)}
/* allocation */
.alloc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:14px}
.al{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.al .n{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.al .n i{flex:none;width:10px;height:10px;border-radius:3px}
.al .v{font:600 22px "Inter Tight",Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.al .v small{font-size:14px;color:var(--faint);font-weight:500}
.al .m{font-size:13px;color:var(--mute)}
.al .m.warn{color:var(--mid)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
/* today */
.today{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px;margin-bottom:22px}
.tslot{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.tslot:first-of-type{border-top:0}
.tslot .tag{flex:none;width:42px;font-size:12px;color:var(--faint)}
.tslot .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rev{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rev:first-of-type{border-top:0}
.rev .nm{flex:1 1 140px}
.rev .nm small{display:block;color:var(--faint);font-size:12px}
.rate{display:flex;gap:4px}
.rate button{border:1px solid var(--line);background:var(--p2);border-radius:7px;min-height:32px;padding:3px 9px;font-size:13px}
.rate button[data-r="2"]:hover,.rate button.g{background:var(--good);color:#141412;border-color:var(--good)}
.rate button[data-r="1"]:hover,.rate button.m{background:var(--mid);color:#141412;border-color:var(--mid)}
.rate button[data-r="0"]:hover,.rate button.b{background:var(--bad);color:#141412;border-color:var(--bad)}
/* calendar */
.cal{display:grid;gap:8px}
.wk{display:grid;grid-template-columns:26px repeat(7,minmax(0,1fr));gap:6px}
.wk .wn{font:600 12px Inter,system-ui,sans-serif;color:var(--faint);writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;align-self:center}
.dhd{display:grid;grid-template-columns:26px repeat(7,minmax(0,1fr));gap:6px;font-size:12px;color:var(--faint);padding:0 2px}
.day{background:var(--p1);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px}
.day.out{background:none;border-style:dashed;opacity:.45}
.day.td{border-color:var(--ink)}
.day .dh{display:flex;justify-content:space-between;gap:4px;font-size:12px;color:var(--mute);white-space:nowrap}
.day.td .dh{color:var(--ink);font-weight:600}
.sl{border:0;border-radius:7px;height:34px;padding:0 7px;font:600 12.5px Inter,system-ui,sans-serif;text-align:left;display:flex;align-items:center;gap:4px;overflow:hidden;white-space:nowrap;background:var(--p2);color:var(--faint)}
.sl .ln,.sl .sn{overflow:hidden;text-overflow:ellipsis}
.sl .sn{display:none}
.sl.s{color:#161614}
.sl.miss{background:transparent!important;border:1.5px dashed var(--c);color:var(--c)}
.sl.b{background:repeating-linear-gradient(135deg,var(--p2) 0 6px,#383731 6px 12px);color:var(--mute)}
.sl.bl{background:transparent;border:1px solid var(--line);color:var(--faint);font-weight:500}
.sl.e{background:transparent;border:2px solid var(--c);color:var(--ink);cursor:default}
.sl.empty:hover{background:#383731;color:var(--mute)}
.sl .ck{margin-left:auto;flex:none;font-size:13px}
.day .td-i{font-size:11.5px;color:var(--mute);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:16px;height:12px;border-radius:3px;background:var(--acc)}
/* forms */
label.f{display:grid;gap:4px;font-size:13px;color:var(--mute)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;min-height:40px;width:100%}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
/* subjects */
.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:14px}
.sh{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.sh i{flex:none;width:14px;height:14px;border-radius:4px}
.sh input{font:600 18px "Inter Tight",Inter,system-ui,sans-serif;background:none;border:0;border-bottom:1px solid transparent;border-radius:0;padding:2px 0;min-height:0}
.sh input:focus{border-color:var(--line)}
.sw{display:flex;gap:6px;margin:10px 0}
.sw button{width:26px;height:26px;border-radius:7px;border:2px solid transparent}
.sw button.on{border-color:var(--ink)}
.tp{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.tp .nm{font-weight:500}
.tp .tn{font-weight:500;background:none;border:1px solid transparent;border-radius:6px;padding:2px 6px;margin-left:-6px;min-height:32px!important;width:100%}
.tp .tn:focus{border-color:var(--line);background:var(--bg)}
.tp.dn .tn{color:var(--mute)}
.clh{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px}
.clh h3{font-size:16px}
.bulk{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:13px;color:var(--faint)}
.bulk input{width:70px!important;min-height:32px!important;padding:4px 8px!important}
.tp .nm small{display:block;font-size:12px;color:var(--faint);font-weight:400}
.dots{display:flex;gap:3px}
.dots b{width:8px;height:8px;border-radius:50%;background:var(--p2)}
.x{border:0;background:none;color:var(--faint);font-size:18px;width:32px;height:32px;border-radius:7px}
.x:hover{background:var(--p2);color:var(--bad)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1 1 auto;width:auto}
.addrow .btn{flex:none}
.meter{height:6px;border-radius:9px;background:var(--p2);overflow:hidden}
.meter b{display:block;height:100%;border-radius:9px}
/* resources */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--p1);border-radius:99px;padding:6px 12px;font-size:13.5px;min-height:36px;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:3px}
.res{display:grid;gap:10px}
.rc{background:var(--p1);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:12px 14px}
.rc.done{opacity:.7}
.rc .rh{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center}
.rc .rh input[type=text]{font-weight:600;background:none;border-color:transparent}
.rc .rh input[type=text]:focus{border-color:var(--line)}
.rc select{width:auto;min-height:36px;font-size:14px;padding:4px 8px}
.meta{font-size:13px;color:var(--mute);margin:6px 0 0 26px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:500;color:var(--faint);font-size:12.5px;padding:6px}
td{padding:4px 6px;border-top:1px solid var(--line)}
td input{min-height:34px!important;padding:4px 6px!important;font-size:15px!important}
td.r,th.r{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.est{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;margin-top:10px}
.est .big{font:700 28px "Inter Tight",Inter,system-ui,sans-serif}
/* todos */
.eis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.q h3{display:flex;justify-content:space-between}
.q p{margin:2px 0 8px;font-size:13px;color:var(--faint)}
.q.q1{border-top:3px solid var(--bad)}.q.q2{border-top:3px solid var(--acc)}.q.q3{border-top:3px solid var(--mid)}.q.q4{border-top:3px solid var(--faint)}
.todo{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.todo .tx{flex:1}
.todo .tx small{display:block;font-size:12px;color:var(--faint)}
.todo.dn .tx{text-decoration:line-through;color:var(--faint)}
.tform{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto auto auto;gap:8px;align-items:center;margin-bottom:16px}
.tform label{display:flex;gap:6px;align-items:center;font-size:14px;white-space:nowrap}
/* focus */
.fk{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.ring{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:8px auto 16px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .t{font:700 clamp(44px,9vw,62px) "Inter Tight",Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;padding:6px 11px;font-size:13.5px;color:var(--mute);min-height:34px}
.seg button.on{background:var(--p2);color:var(--ink)}
/* progress */
.pr{display:grid;gap:10px}
.prc{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(4,minmax(0,1fr));gap:14px;align-items:center}
.amp{display:flex;align-items:center;gap:8px;font-weight:600}
.amp b{flex:none;width:12px;height:12px;border-radius:50%}
.kv{font-size:12.5px;color:var(--faint)}
.kv strong{display:block;font:600 18px "Inter Tight",Inter,system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--mute);grid-column:1/-1;margin-top:-4px}
.bars{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:10px}
.bars .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px;position:relative}
.bars .c b{display:block;border-radius:3px}
.bars .c span{font-size:11px;color:var(--faint);text-align:center;margin-top:4px;white-space:nowrap}
.bars .c em{font-style:normal;font-size:11px;color:var(--mute);text-align:center}
/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.on{display:flex}
.md{background:var(--p1);border:1px solid var(--line);border-radius:16px;width:min(540px,100%);max-height:calc(100% - 32px);overflow:auto;padding:18px}
.md h3{margin-bottom:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:14px 0}
.opt{border:2px solid transparent;border-radius:9px;min-height:44px;padding:6px 10px;text-align:left;font-weight:600;background:var(--p2)}
.opt.on{border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;display:none;gap:12px;align-items:center;z-index:60;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.toast.on{display:flex}
.toast button{border:0;background:none;color:var(--pri);font-weight:600;text-decoration:underline}
.sm-i{display:none}
@media(max-width:600px){.lg{display:none}.sm-i{display:inline;font-size:18px}}
#aiFab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:40;border:0;border-radius:99px;padding:12px 18px;min-height:48px;background:var(--pri);color:#fff;font:600 15px Inter,system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.45)}
#aiFab:hover{background:#3a6dca}
#aiP{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--p1);border-left:1px solid var(--line);z-index:45;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.35)}
#aiP[hidden]{display:none}
.aih{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line);padding-top:max(12px,env(safe-area-inset-top,0px))}
.aih b{font:600 17px "Inter Tight",Inter,system-ui,sans-serif;margin-right:auto}
.ail{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.am{max-width:90%;padding:9px 12px;border-radius:12px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.am.u{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:4px}
.am.a{align-self:flex-start;background:var(--p2);border-bottom-left-radius:4px}
.am.a.er{border:1px solid var(--bad)}
.am ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--mute);white-space:normal}
.am ul.e li{color:var(--bad)}
.am .btn{margin-top:8px}
.dots3{display:inline-flex;gap:4px}.dots3 i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:bl 1s infinite}.dots3 i:nth-child(2){animation-delay:.2s}.dots3 i:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{opacity:.25}}
.exs{display:grid;gap:6px;margin-top:4px}
.exs button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:14px;color:var(--ink);min-height:44px}
.exs button:hover{background:var(--p2)}
.aif{display:flex;gap:8px;align-items:flex-end;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.aif textarea{flex:1;resize:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:16px;min-height:44px;max-height:140px}
.aik{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;font-size:14px}
.aik ol{margin:0;padding-left:18px;display:grid;gap:4px;color:var(--mute)}
.aik a{color:var(--acc)}
@media(prefers-reduced-motion:reduce){.dots3 i{animation:none}}
.empty-st{padding:28px;text-align:center;color:var(--mute)}
@media(max-width:900px){.today,.fk{grid-template-columns:minmax(0,1fr)}.prc{grid-template-columns:repeat(2,minmax(0,1fr))}.prc .amp{grid-column:1/-1}.tform{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.tform input[type=text]{grid-column:1/-1}}

<script>
{
const LS='ethLernplaner.v1';
const PAL=['#e8806b','#7ea6f4','#7cc68b','#c59ff0','#e2c15c','#5fc9c4','#f08fb8','#b9b39f'];
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON=['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sep.','Okt.','Nov.','Dez.'];
const KINDS=['Altprüfung','Übungsserie','PVK','Skript','Zusammenfassung','Andere'];
const REL=['Hoch','Mittel','Tief'];
const RN=['schlecht','mittel','gut'];
const RC=['var(--bad)','var(--mid)','var(--good)'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id8=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffD=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const TODAY=()=>iso(new Date());
const nowKey=()=>TODAY()+(new Date().getHours()<12?'|a':'|p');
const fmt=s=>{if(!s)return'–';const d=parse(s);return d.getDate()+'. '+MON[d.getMonth()]};
const fmtY=s=>fmt(s)+' '+parse(s).getFullYear();
const fmtW=s=>WD[parse(s).getDay()]+', '+fmt(s);
const sum=a=>a.reduce((x,y)=>x+y,0);
const grade=(p,m)=>m>0?Math.max(1,Math.min(6,Math.round((1+5*p/m)*4)/4)):null;
const gfmt=g=>g==null?'–':g.toFixed(2).replace(/0$/,'');

/* ---------- state ---------- */
let S=null,hist=[],view='kalender',showPast=false,lsF='all',syncSt='lokal';
const blank=()=>{const t=TODAY();return{v:1,updated:Date.now(),sample:false,phase:{start:t,end:addD(t,34)},hours:{a:['08:00','12:00'],p:['13:00','17:00']},buffer:.12,style:'block',iv:[1,3,7,14,30],subjects:[],slots:{},res:[],todos:[],focus:[]}};
function snap(){hist.push(JSON.stringify(S));if(hist.length>30)hist.shift()}
function sub(id){return S.subjects.find(s=>s.id===id)}
function lastR(t){return t.ratings.length?t.ratings[t.ratings.length-1].r:null}
function mastery(s){if(!s.topics.length)return 0;return sum(s.topics.map(t=>[0,.5,1][lastR(t)]??(t.done?.4:0)))/s.topics.length}
function clc(s,c){const it=s.topics.filter(x=>(x.cat||'v')===c);return[it.filter(x=>x.done).length,it.length]}
function rateTopic(s,t,r,d){
  d=d||TODAY();t.ratings.push({d,r});t.done=true;
  const iv=S.iv;t.lvl=r===2?Math.min((t.lvl||0)+1,iv.length-1):r===1?(t.lvl||0):0;
  let n=addD(d,r===0?1:iv[t.lvl]);
  if(s.exam&&n>=s.exam)n=addD(s.exam,-1);
  if(n<=d)n=addD(d,1);t.next=n;
}
function examKey(s){return s.exam+'|'+(s.time&&s.time<'12:00'?'a':'p')}
function examMap(){const m={};S.subjects.forEach(s=>{if(s.exam)m[examKey(s)]=s});return m}
function lastExam(){const k=S.subjects.filter(s=>s.exam).map(examKey).sort();return k[k.length-1]||(S.phase.end+'|z')}
function phaseKeys(){const o=[];if(S.phase.start>S.phase.end)return o;for(let d=S.phase.start;d<=S.phase.end;d=addD(d,1))o.push(d+'|a',d+'|p');return o}
function usableKeys(){const ex=examMap(),le=lastExam();return phaseKeys().filter(k=>!ex[k]&&S.slots[k]?.t!=='x'&&k<le)}
function weight(s){
  const def=s.topics.length?sum(s.topics.map(t=>[1,.5,0][lastR(t)]??(t.done?.5:.8)))/s.topics.length:.5;
  const g=examGrade(s);const gap=g!=null&&g<s.target?Math.min(1,(s.target-g)/1.5):0;
  return Math.max(.5,s.ects||1)*(.6+def+.4*gap)*(1+.12*((s.target||4)-4));
}
function alloc(){
  const us=usableKeys(),B=Math.round(us.length*S.buffer),subs=S.subjects.filter(s=>s.exam);
  const W=subs.map(weight),sw=sum(W)||1,rec={};
  subs.forEach((s,i)=>{const cap=us.filter(k=>k<examKey(s)).length;rec[s.id]=Math.min(cap,Math.round((us.length-B)*W[i]/sw))});
  return{us,B,rec};
}
function autoplan(replan,from){
  const tk=from?from+'|a':nowKey();
  if(replan)for(const k in S.slots){const v=S.slots[k];if(v.auto&&!v.done&&k>=tk&&(v.t==='s'||v.t==='b'))delete S.slots[k]}
  const{us,B,rec}=alloc(),subs=S.subjects.filter(s=>s.exam),have={};let buf=0;
  us.forEach(k=>{const v=S.slots[k];if(!v)return;if(v.t==='s')have[v.s]=(have[v.s]||0)+1;if(v.t==='b')buf++});
  const free=us.filter(k=>k>=tk&&!S.slots[k]),need={};
  subs.forEach(s=>need[s.id]=Math.max(0,(rec[s.id]||0)-(have[s.id]||0)));
  const set=(k,v)=>{S.slots[k]=Object.assign(v,{auto:true})};
  subs.forEach(s=>{const e=examKey(s),c=free.filter(k=>k<e&&!S.slots[k]),k=c[c.length-1];if(k&&need[s.id]>0){set(k,{t:'s',s:s.id});need[s.id]--}});
  let rest=free.filter(k=>!S.slots[k]);const bn=Math.max(0,B-buf);
  if(bn>0&&rest.length){const st=rest.length/bn;for(let j=0;j<bn;j++){const k=rest[Math.min(rest.length-1,Math.floor((j+.6)*st))];if(k&&!S.slots[k])set(k,{t:'b'})}}
  rest=free.filter(k=>!S.slots[k]);let prev=null,n=0;
  rest.forEach((k,i)=>{
    let best=null,bs=0;
    subs.forEach(s=>{if(need[s.id]<=0)return;const e=examKey(s);if(k>=e)return;
      let left=0;for(let j=i;j<rest.length;j++)if(rest[j]<e)left++;
      let sc=need[s.id]/Math.max(1,left);if(diffD(k.slice(0,10),s.exam)<=3)sc*=2;if(S.style==='block'&&k.endsWith('p')&&S.slots[k.slice(0,10)+'|a']?.s===s.id)sc*=1.8;if(S.style==='mix'&&prev===s.id)sc*=.8;if(sc>bs){bs=sc;best=s}});
    if(best){set(k,{t:'s',s:best.id});need[best.id]--;prev=best.id;n++}
  });
  return n;
}
function examGrade(s){
  const r=S.res.filter(x=>x.s===s.id&&x.kind==='Altprüfung'&&x.done&&x.tasks?.length).sort((a,b)=>(a.doneAt||'')<(b.doneAt||'')?-1:1);
  if(!r.length)return null;const l=r[r.length-1];return grade(sum(l.tasks.map(t=>+t.p||0)),sum(l.tasks.map(t=>+t.m||0)));
}

/* ---------- sample ---------- */
function sample(){
  const t=TODAY(),A=n=>addD(t,n);let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
  const tp=(names,ser)=>names.map((n,i)=>({id:id8(),name:'V'+(i+1)+' · '+n,cat:'v',done:false,lvl:0,next:null,ratings:[]})).concat(Array.from({length:ser},(_,i)=>({id:id8(),name:'Übung '+(i+1),cat:'u',done:false,lvl:0,next:null,ratings:[]})));
  const st=Object.assign(blank(),{sample:true,updated:0,phase:{start:A(-14),end:A(25)}});S=st;
  st.subjects=[
    {id:'ana',name:'Analysis I',short:'Ana',color:PAL[0],ects:7,exam:A(6),time:'09:00',target:4.5,topics:tp(['Folgen & Reihen','Stetigkeit','Differentialrechnung','Integralrechnung','Taylor-Reihen'],8)},
    {id:'mgz',name:'Molekulare Genetik & Zellbiologie',short:'MGZ',color:PAL[1],ects:6,exam:A(12),time:'14:00',target:5,topics:tp(['DNA-Replikation','Transkription & Translation','Genregulation','Zellzyklus','Membranen & Transport'],6)},
    {id:'che',name:'Allgemeine Chemie',short:'Chem',color:PAL[2],ects:6,exam:A(18),time:'09:00',target:4.75,topics:tp(['Atombau & PSE','Chemische Bindung','Gleichgewichte','Säuren & Basen','Redox'],7)},
    {id:'phy',name:'Physik I',short:'Phy',color:PAL[3],ects:5,exam:A(25),time:'09:00',target:4.5,topics:tp(['Kinematik','Newton & Kräfte','Energie & Impuls','Schwingungen'],6)}];
  const R={ana:[[1,2,2],[0,1],[1,1,0],[0,0],[]],mgz:[[2,2],[1,2],[0],[1],[]],che:[[2],[1],[0],[],[]],phy:[[],[1],[],[]]};
  st.subjects.forEach(s=>s.topics.forEach((x,i)=>(R[s.id][i]||[]).forEach((r,j)=>rateTopic(s,x,r,A(-13+j*4+i)))));
  const UD={ana:6,mgz:4,che:3,phy:1};st.subjects.forEach(s=>s.topics.filter(x=>x.cat==='u').forEach((x,i)=>{if(i<UD[s.id])x.done=true}));st.subjects[0].topics[4].done=true;rateTopic(st.subjects[0],st.subjects[0].topics.find(x=>x.name==='Übung 3'),0,A(-2));
  st.slots[A(-9)+'|p']={t:'x',note:'Arbeit'};st.slots[A(-3)+'|p']={t:'x',note:'Arbeit'};st.slots[A(4)+'|p']={t:'x',note:'Arbeit'};st.slots[A(-6)+'|a']={t:'x',note:'Arzttermin'};
  autoplan(false,st.phase.start);
  const nk=nowKey();for(const k in st.slots){const v=st.slots[k];if(k<nk&&(v.t==='s'||v.t==='b'))v.done=rnd()<.86}
  const r=(s,name,kind,rel,done,tasks)=>({id:id8(),s,name,kind,rel,done,doneAt:done?A(-4):null,note:'',tasks:tasks||[]});
  const T=(s,i)=>st.subjects.find(x=>x.id===s).topics[i].id;
  st.res=[
    r('ana','Prüfung HS24','Altprüfung','Hoch',true,[{n:'1',t:T('ana',0),p:8,m:10},{n:'2',t:T('ana',1),p:4,m:10},{n:'3',t:T('ana',2),p:7,m:12},{n:'4',t:T('ana',3),p:3,m:10}]),
    r('ana','Prüfung FS24','Altprüfung','Hoch',false,[{n:'1',t:T('ana',0),p:'',m:10},{n:'2',t:T('ana',3),p:'',m:12},{n:'3',t:T('ana',4),p:'',m:8}]),
    r('ana','PVK Analysis I','PVK','Hoch',false),r('ana','Serien 1–12 nochmals','Übungsserie','Mittel',true),
    r('mgz','Prüfung HS23','Altprüfung','Hoch',true,[{n:'1',t:T('mgz',0),p:9,m:10},{n:'2',t:T('mgz',2),p:5,m:10},{n:'3',t:T('mgz',3),p:6,m:8}]),
    r('mgz','Folien Biochemical Foundations of Life','Skript','Mittel',false),
    r('che','Prüfung HS24','Altprüfung','Hoch',false,[{n:'1',t:T('che',1),p:'',m:12},{n:'2',t:T('che',2),p:'',m:10}]),
    r('che','Zusammenfassung Gleichgewichte','Zusammenfassung','Mittel',false),
    r('phy','Prüfung FS24','Altprüfung','Hoch',false),r('phy','Prüfung HS19','Altprüfung','Tief',false)];
  st.res[0].note='Kettenregel vergessen bei 3b';
  const fs=Object.keys(st.slots).filter(k=>k>=nk&&st.slots[k].t==='s'&&st.slots[k].s==='ana');if(fs[0])st.slots[fs[0]].r=[st.res[1].id];
  st.todos=[
    {id:id8(),tx:'Prüfungsanmeldung in myStudies kontrollieren',s:null,due:A(1),imp:true,urg:true,done:false},
    {id:id8(),tx:'Formelsammlung Physik drucken',s:'phy',due:A(22),imp:true,urg:false,done:false},
    {id:id8(),tx:'Nochmals anschauen: HS24 Aufgabe 2 (Stetigkeit)',s:'ana',due:null,imp:true,urg:false,done:false},
    {id:id8(),tx:'Lerngruppe MGZ organisieren',s:'mgz',due:A(3),imp:false,urg:true,done:false},
    {id:id8(),tx:'Schreibtisch aufräumen',s:null,due:null,imp:false,urg:false,done:false},
    {id:id8(),tx:'Taschenrechner-Batterien wechseln',s:'che',due:A(-2),imp:true,urg:true,done:true}];
  for(let d=-13;d<0;d++){const day=A(d);['a','p'].forEach(h=>{const v=st.slots[day+'|'+h];if(v?.t==='s'&&v.done){const n=1+Math.floor(rnd()*3);for(let i=0;i<n;i++)st.focus.push({d:day,s:v.s,m:rnd()<.6?50:25})}})}
  return st;
}
function migrate(x){const b=blank();x=Object.assign(b,x);x.subjects.forEach(s=>{s.topics=s.topics||[];s.topics.forEach(t=>{t.cat=t.cat||'v';if(t.done==null)t.done=!!(t.ratings&&t.ratings.length)})});return x}

/* ---------- persistence ---------- */
/* Firebase-Konfiguration: entweder hier einfügen (dann gilt sie auf allen Geräten)
   oder in der App unter «Konto» einfügen (dann pro Gerät einmal). */
const FIREBASE_CONFIG={apiKey:"AIzaSyDzdeTsJpIZgqBXUKvZJx4AQTXMmheDxb8",authDomain:"lernplanereth.firebaseapp.com",projectId:"lernplanereth",storageBucket:"lernplanereth.firebasestorage.app",messagingSenderId:"296815893187",appId:"1:296815893187:web:cb45f5abe1fa18ed086076"};
const FB='https://www.gstatic.com/firebasejs/10.12.2';
let fb=null,ref=null,unsub=null,user=null,saveT=null,writing=false,again=false;
function load(){try{const r=localStorage.getItem(LS);if(r)return migrate(JSON.parse(r))}catch(e){}return sample()}
function save(noRender){S.updated=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}if(!noRender)render();clearTimeout(saveT);saveT=setTimeout(push,700)}
function keepLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
async function push(){if(!ref)return;if(writing){again=true;return}writing=true;setSync('busy');
  try{await fb.F.setDoc(ref,{state:JSON.stringify(S),updated:S.updated});setSync('ok')}catch(e){setSync('err')}
  writing=false;if(again){again=false;push()}}
function setSync(s){syncSt=s;const el=$('#sync');el.className='sync '+({ok:'ok',busy:'busy',err:'err',abgemeldet:'busy'}[s]||'');
  el.lastElementChild.textContent={ok:'Synchronisiert',busy:'Speichert …',err:'Nicht synchronisiert',lokal:'Sync einrichten',abgemeldet:'Anmelden',laden:'Verbinde …'}[s]||s}
function cfgGet(){try{const c=JSON.parse(localStorage.getItem(LS+'.fb'));if(c)return c}catch(e){}return FIREBASE_CONFIG}
function parseCfg(t){const o={};String(t).replace(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g,(_,k,v)=>{o[k]=v});return o.apiKey&&o.projectId?o:null}
async function initFb(){
  const c=cfgGet();if(!c){setSync('lokal');return}
  setSync('laden');
  try{const [A,U,F]=await Promise.all([import(FB+'/firebase-app.js'),import(FB+'/firebase-auth.js'),import(FB+'/firebase-firestore.js')]);
    const app=A.initializeApp(c);fb={U,F,auth:U.getAuth(app),db:F.getFirestore(app)};
    U.onAuthStateChanged(fb.auth,u=>{
      user=u;if(unsub){unsub();unsub=null}ref=null;
      if(!u){setSync('abgemeldet');if($('#ov').classList.contains('on')&&modalAcc)accountModal();return}
      const first=(()=>{try{return localStorage.getItem(LS+'.uid')!==u.uid}catch(e){return true}})();let seen=!first;
      ref=F.doc(fb.db,'users',u.uid);
      unsub=F.onSnapshot(ref,sn=>{
        if(sn.metadata.hasPendingWrites)return;
        if(sn.metadata.fromCache&&!seen)return;
        const mark=()=>{seen=true;try{localStorage.setItem(LS+'.uid',u.uid)}catch(e){}};
        if(!sn.exists()){mark();if(S.updated>0)push();else setSync('ok');return}
        const d=sn.data();
        if(!seen||d.updated>S.updated){try{S=migrate(JSON.parse(d.state));keepLocal();render()}catch(e){}}
        else if(d.updated<S.updated)push();
        mark();if(!writing)setSync('ok');
      },e=>setSync('err'));
      if($('#ov').classList.contains('on')&&modalAcc)accountModal();
    });
  }catch(e){setSync('err')}
}

function stat(s,rec){
  const nk=nowKey(),ks=Object.keys(S.slots).filter(k=>S.slots[k].t==='s'&&S.slots[k].s===s.id);

  const adh=past.length?doneP/past.length:1,proj=done+fut*adh,r=rec[s.id]||0,m=mastery(s),g=examGrade(s),fm=sum(S.focus.filter(f=>f.s===s.id).map(f=>f.m));
  const gs=g==null?null:g>=s.target?1:g>=s.target-.5?.65:g>=4?.4:.15;
  const sc=.5*Math.min(1,r?proj/r:1)+.5*(gs??(.5*m+.3*((s.topics.length?sum(s.topics.map(t=>t.done?1:0))/s.topics.length:0))+.2));

  const amp=over?['var(--faint)','Prüfung vorbei']:sc>=.78?['var(--good)','Auf Kurs']:sc>=.58?['var(--mid)','Knapp']:['var(--bad)','Kritisch'];

Antworte IMMER nur mit einem JSON-Objekt: {"reply":"kurze Antwort auf Deutsch (Schweizer Schreibweise mit ss, locker, Du-Form)","actions":[...]}
Erlaubte Aktionen (Datum immer YYYY-MM-DD, Zeit HH:MM):
{"type":"add_subject","name":"…","short":"max 5 Zeichen","exam":"…","time":"…","ects":5,"target":4.5}
{"type":"update_subject","subject":"…","name"?,"short"?,"exam"?,"time"?,"ects"?,"target"?}
{"type":"delete_subject","subject":"…"}
{"type":"add_items","subject":"…","cat":"v" oder "u","names":["…"]}   (v = Vorlesung, u = Übung)
{"type":"set_done","subject":"…","items":["…"],"done":true}
{"type":"rate","subject":"…","items":["…"],"rating":"gut"|"mittel"|"schlecht"}
{"type":"rename_item","subject":"…","item":"…","name":"…"}
{"type":"delete_items","subject":"…","items":["…"]}
{"type":"add_todo","text":"…","subject"?,"due"?,"important":true,"urgent":false}
{"type":"todo_done","todo":"…","done":true}
{"type":"delete_todo","todo":"…"}
{"type":"set_slot","date":"…","half":"vm"|"nm"|"beide","kind":"fach"|"buffer"|"blockiert"|"leer","subject"?,"note"?}
{"type":"slot_done","date":"…","half":"vm"|"nm"|"beide","done":true}
{"type":"add_resource","subject":"…","name":"…","kind":"Altprüfung"|"Übungsserie"|"PVK"|"Skript"|"Zusammenfassung"|"Andere","relevance":"Hoch"|"Mittel"|"Tief"}
{"type":"resource_done","resource":"…","done":true}
{"type":"set_phase","start":"…","end":"…"}
{"type":"autoplan","replan":false}
subject, items, todo und resource sind die IDs aus dem Kontext. Für ein Fach, das du in derselben Antwort neu anlegst, nimm seinen Namen als subject.
Regeln:
- Mach genau das, worum gebeten wird, nicht mehr. Kein autoplan, ausser der Nutzer will es.
- Wenn etwas unklar ist (z. B. welches Fach, welches Datum), frag kurz nach und gib keine Aktionen zurück.

let IMP=null;
const ROM=/^(i|ii|iii|iv|v|vi|vii|viii|ix|x|\d+)$/;
function nz(x){return String(x).toLowerCase().replace(/\(.*?\)/g,' ').replace(/^\s*(vorlesung|vl|v|übung|uebung|ü|serie|kapitel|modul|biotutor)?\s*\d+\s*[·:.\-–]?\s*/i,'').replace(/[^a-z0-9äöüé]+/g,' ').trim()}
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function same(a,b){const A=nz(a),B=nz(b);if(!A||!B)return false;if(A===B)return true;
  const ta=A.split(' '),tb=B.split(' '),ra=ta.filter(t=>ROM.test(t)).join(),rb=tb.filter(t=>ROM.test(t)).join();if(ra!==rb)return false;
  const st=t=>t.filter(x=>!ROM.test(x)).map(x=>x.replace(/(en|n|e|s)$/,'')).join(' '),x=st(ta),y=st(tb);return x.length>=6&&lev(x,y)<=2}

  askok(){const f=askFn;askFn=null;close();f&&f()},
  plan(){snap();const n=autoplan(false);save();toast(n?n+' Halbtage verteilt':'Keine freien Halbtage mehr',!!n)},
  replan(){ask('Neu verteilen?','Alle automatisch geplanten, noch nicht erledigten Halbtage ab jetzt werden neu verteilt. Was du selbst gesetzt hast, bleibt.','Neu verteilen',()=>{snap();const n=autoplan(true);save();toast(n+' Halbtage neu verteilt',true)})},
  past(){showPast=!showPast;render()},
  slot(b){slotModal(b.dataset.k)},
  setslot(b){const k=modalK,v=b.dataset.v,o=S.slots[k]||{};snap();
    if(!v)delete S.slots[k];else if(v==='b')S.slots[k]={t:'b',note:o.note,done:o.done};else if(v==='x')S.slots[k]={t:'x',note:o.t==='x'?o.note:''};else S.slots[k]={t:'s',s:v.slice(2),note:o.note,done:o.done,r:o.s===v.slice(2)?o.r:[]};
    save();if(!v)close();else slotModal(k)},
  slotok(){const k=modalK,v=S.slots[k];if(v){const d=$('#slDone'),n=$('#slNote');if(d)v.done=d.checked;if(n)v.note=n.value.trim();const r=[...document.querySelectorAll('.slRes:checked')].map(x=>x.value);if(v.t==='s')v.r=r;save()}close()},
  done(b){snap();const v=S.slots[b.dataset.k];v.done=!v.done;save()},
  rate(b){const s=sub(b.dataset.s),t=s.topics.find(x=>x.id===b.dataset.t);snap();rateTopic(s,t,+b.dataset.r);save();toast(`${t.name}: ${RN[+b.dataset.r]} · nächste Wiederholung ${fmt(t.next)}`,true)},
  addsub(){snap();const i=S.subjects.length;S.subjects.push({id:id8(),name:'Neues Fach',short:'',color:PAL[i%PAL.length],ects:5,exam:addD(S.phase.end,0),time:'09:00',target:4.5,topics:[]});save();setTimeout(()=>{const ins=document.querySelectorAll('.sh input');ins[ins.length-1]?.select()},30)},
  delsub(b){const s=sub(b.dataset.s);ask('Fach löschen?',`«${s.name}» mit allen Themen, Halbtagen und Lernstoff löschen?`,'Löschen',()=>{snap();S.subjects=S.subjects.filter(x=>x!==s);for(const k in S.slots)if(S.slots[k].s===s.id)delete S.slots[k];S.res=S.res.filter(r=>r.s!==s.id);S.todos.forEach(t=>{if(t.s===s.id)t.s=null});save();toast('Fach gelöscht',true)})},
  color(b){snap();sub(b.dataset.s).color=b.dataset.c;save()},
  addtopic(b){const s=sub(b.dataset.s),c=b.dataset.c||'v',id='#nt-'+s.id+'-'+c,v=$(id).value.trim();if(!v)return;snap();s.topics.push({id:id8(),name:v,cat:c,done:false,lvl:0,next:null,ratings:[]});save();setTimeout(()=>$(id)?.focus(),20)},
  bulk(b){const s=sub(b.dataset.s),c=b.dataset.c,n=Math.max(1,Math.min(40,+$('#nq-'+s.id+'-'+c).value||0)),k=s.topics.filter(x=>x.cat===c).length;snap();
    for(let i=1;i<=n;i++)s.topics.push({id:id8(),name:(c==='v'?'Vorlesung ':'Übung ')+(k+i),cat:c,done:false,lvl:0,next:null,ratings:[]});save();toast(n+(c==='v'?' Vorlesungen':' Übungen')+' erstellt – Namen kannst du direkt anpassen',true)},
  deltopic(b){const s=sub(b.dataset.s);snap();s.topics=s.topics.filter(x=>x.id!==b.dataset.t);save();toast('Eintrag gelöscht',true)},
  lsf(b){lsF=b.dataset.v;render()},
  addres(b){snap();S.res.push({id:id8(),s:b.dataset.s,name:'Neue Ressource',kind:'Altprüfung',rel:'Hoch',done:false,doneAt:null,note:'',tasks:[{n:'1',t:'',p:'',m:10}]});save()},
  delres(b){snap();S.res=S.res.filter(r=>r.id!==b.dataset.r);for(const k in S.slots){const v=S.slots[k];if(v.r)v.r=v.r.filter(x=>x!==b.dataset.r)}save();toast('Ressource gelöscht',true)},
  addtask(b){const r=S.res.find(x=>x.id===b.dataset.r);snap();r.tasks.push({n:String(r.tasks.length+1),t:'',p:'',m:10});save()},
  deltask(b){const r=S.res.find(x=>x.id===b.dataset.r);snap();r.tasks.splice(+b.dataset.i,1);save()},
  resfb(b){const r=S.res.find(x=>x.id===b.dataset.r),s=sub(r.s);snap();let n=0;
    const by={};r.tasks.forEach(t=>{if(!t.t||t.p===''||!(t.m>0))return;(by[t.t]=by[t.t]||[0,0]);by[t.t][0]+=+t.p;by[t.t][1]+=+t.m});
    for(const tid in by){const x=s.topics.find(y=>y.id===tid);if(!x)continue;const pc=by[tid][0]/by[tid][1];rateTopic(s,x,pc>=.75?2:pc>=.5?1:0);n++}
    if(!r.done){r.done=true;r.doneAt=TODAY()}save();toast(n?n+' Einträge bewertet':'Ordne den Aufgaben zuerst Vorlesungen oder Übungen zu',!!n)},
  addtodo(){const tx=$('#tdTx').value.trim();if(!tx){$('#tdTx').focus();return}snap();S.todos.push({id:id8(),tx,s:$('#tdS').value||null,due:$('#tdD').value||null,imp:$('#tdI').checked,urg:$('#tdU').checked,done:false});save();setTimeout(()=>$('#tdTx')?.focus(),20)},
  todo(b){const t=S.todos.find(x=>x.id===b.dataset.id);snap();t.done=!t.done;save()},
  deltodo(b){snap();S.todos=S.todos.filter(x=>x.id!==b.dataset.id);save();toast('To-Do gelöscht',true)},
  preset(b){if(TM.run||tEl()>0){toast('Zuerst den laufenden Block stoppen');return}if(b.dataset.v==='watch')TM.mode='watch';else{TM.mode='pomo';TM.pre=b.dataset.v.split('/').map(Number)}TM.ph='work';render()},
  tgo(){try{TM.ctx=TM.ctx||new(window.AudioContext||window.webkitAudioContext)();TM.ctx.resume()}catch(e){}
    if(TM.run){TM.acc+=Date.now()-TM.st;TM.run=false}else{TM.st=Date.now();TM.run=true}tick()},
  tstop(){const m=tEl()/60000,w=TM.ph==='work';if(w)logFocus(m);TM.run=false;TM.acc=0;TM.ph='work';if(w&&m>=1)toast(Math.round(m)+' min gespeichert');render()},
  tskip(){if(TM.ph==='work')logFocus(tEl()/60000);TM.run=false;TM.acc=0;TM.ph=TM.ph==='work'?'break':'work';render()},
  delfocus(b){snap();S.focus.splice(+b.dataset.i,1);save()},
  stsave(){const st=$('#stS').value,en=$('#stE').value;if(!st||!en||st>en){toast('Start muss vor dem Ende liegen');return}snap();
    S.phase={start:st,end:en};S.hours={a:[$('#stA0').value||'08:00',$('#stA1').value||'12:00'],p:[$('#stP0').value||'13:00',$('#stP1').value||'17:00']};
    S.buffer=Math.max(0,Math.min(40,+$('#stB').value||0))/100;S.style=$('#stSt').value;
    const iv=$('#stIv').value.split(/[,; ]+/).map(Number).filter(n=>n>0).sort((a,b)=>a-b);if(iv.length)S.iv=iv;save();close();toast('Gespeichert',true)},
  export(){dl('lernplaner-'+TODAY()+'.json',JSON.stringify(Object.assign({},S,{ai:null}),null,1),'application/json');toast('Backup gesichert')},
  account(){accountModal()},
  async impopen(){let t=null,msg='';try{const r=await fetch('import.json?'+Date.now(),{cache:'no-store'});if(r.ok)t=await r.json();else msg='Keine Vorlage online gefunden.'}catch(e){msg='Vorlage konnte nicht geladen werden.'}impShow(t,msg)},
  impfile(){$('#impIn').click()},
  impgo(){if(!IMP)return;snap();let add=0,ren=0,skip=0,nf=0;
    IMP.faecher.forEach((t,i)=>{const v=$('#imp-'+i).value;if(v==='__skip')return;let s;
      if(v==='__new'){s={id:id8(),name:String(t.name),short:String(t.short||'').slice(0,5),color:PAL[S.subjects.length%PAL.length],ects:+t.ects||5,exam:S.phase.end,time:'09:00',target:4.5,topics:[]};S.subjects.push(s);nf++}else s=sub(v);if(!s)return;
      [['v',t.vorlesungen],['u',t.uebungen]].forEach(([c,a])=>{const ex=s.topics.filter(x=>(x.cat||'v')===c),used=new Set();
        (a||[]).forEach(nm=>{nm=String(nm);if(ex.some(x=>!used.has(x.id)&&same(x.name,nm)&&used.add(x.id))){skip++;return}
          const n=(nm.match(/(\d+)/)||[])[1],g=n!=null&&ex.find(x=>!used.has(x.id)&&GEN.test(x.name)&&+x.name.match(GEN)[2]===+n);
          if(g){used.add(g.id);g.name=nm;ren++}else{s.topics.push({id:id8(),name:nm,cat:c,done:false,lvl:0,next:null,ratings:[]});add++}})});
    });S.sample=false;save();close();toast(`${add} neu${ren?', '+ren+' umbenannt':''}${skip?', '+skip+' schon vorhanden':''}${nf?', '+nf+' Fächer angelegt':''}`,true)},
  aiopen(){$('#aiP').hidden=false;$('#aiFab').hidden=true;renderAI();setTimeout(()=>$('#aiT')?.focus(),30)},
  aiclose(){$('#aiP').hidden=true;$('#aiFab').hidden=false},
  aiclear(){AI.msgs=[];renderAI()},
  aiex(b){$('#aiT').value=b.dataset.v;$('#aiT').focus()},
  aikey(){AI.edit=true;renderAI()},
  aikeyback(){AI.edit=false;renderAI()},
  aikeysave(){const k=$('#aiKeyIn').value.trim();if(k.length<20){toast('Das sieht nicht nach einem Schlüssel aus');return}S.ai={key:k};AI.models=null;AI.edit=false;save(true);renderAI();setTimeout(()=>$('#aiT')?.focus(),30)},
  aikeydel(){S.ai=null;AI.edit=false;save(true);renderAI()},
  aiundo(){ACT.undo();const m=AI.msgs[AI.msgs.length-1];if(m){m.undo=false;m.log=[];m.text+='\n(rückgängig gemacht)'}renderAI()},
  fbedit(){modalAcc=true;modal(`<h3>Firebase-Konfiguration</h3><p class="small muted">Füge den Block <code>const firebaseConfig = {…}</code> aus der Firebase-Konsole ein.</p><textarea id="fbCfg" rows="6" style="font:13px/1.4 ui-monospace,monospace"></textarea><div class="row" style="justify-content:space-between;margin-top:10px"><button class="btn sm ghost" data-act="fbreset">Zurück zur Standard-Konfiguration</button><button class="btn pri" data-act="fbsave">Speichern</button></div>`)},
  fbsave(){const c=parseCfg($('#fbCfg').value);if(!c){accountModal('Das sieht nicht nach einer Firebase-Konfiguration aus. Kopiere den ganzen Block mit apiKey, projectId usw.');return}try{localStorage.setItem(LS+'.fb',JSON.stringify(c))}catch(e){}location.reload()},
  fbreset(){ask('Standard-Konfiguration verwenden?','Die eingefügte Konfiguration wird auf diesem Gerät entfernt. Deine Daten bleiben erhalten.','OK',()=>{try{localStorage.removeItem(LS+'.fb')}catch(e){}location.reload()})},
  async login(){const e=$('#auE').value.trim(),p=$('#auP').value;try{await fb.U.signInWithEmailAndPassword(fb.auth,e,p);toast('Angemeldet')}catch(x){accountModal(AERR[x.code]||'Anmelden hat nicht geklappt ('+x.code+').')}},
  async signup(){const e=$('#auE').value.trim(),p=$('#auP').value;try{await fb.U.createUserWithEmailAndPassword(fb.auth,e,p);toast('Konto erstellt – Sync läuft')}catch(x){accountModal(AERR[x.code]||'Konto erstellen hat nicht geklappt ('+x.code+').')}},
  async reset(){const e=$('#auE').value.trim();if(!e){accountModal('Gib zuerst deine E-Mail ein.');return}try{await fb.U.sendPasswordResetEmail(fb.auth,e);toast('E-Mail zum Zurücksetzen verschickt')}catch(x){accountModal(AERR[x.code]||x.code)}},
  async logout(){await fb.U.signOut(fb.auth);close();toast('Abgemeldet – Daten bleiben auf diesem Gerät')},
  import(){$('#fileIn').click()},
  async ics(){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Lernplaner//DE','CALSCALE:GREGORIAN'],st=(d,t)=>d.replace(/-/g,'')+'T'+t.replace(':','')+'00';
    const ev=(u,d,a,b,s)=>L.push('BEGIN:VEVENT','UID:'+u+'@lernplaner','DTSTAMP:'+st(TODAY(),'00:00')+'Z','DTSTART:'+st(d,a),'DTEND:'+st(d,b),'SUMMARY:'+s.replace(/[,;\\]/g,m=>'\\'+m),'END:VEVENT');
    for(const k in S.slots){const v=S.slots[k],d=k.slice(0,10),h=k.endsWith('a')?S.hours.a:S.hours.p;if(v.t==='s'&&sub(v.s))ev(k.replace('|',''),d,h[0],h[1],'Lernen: '+sub(v.s).name+(v.note?' – '+v.note:''));if(v.t==='b')ev(k.replace('|',''),d,h[0],h[1],'Buffer')}
    S.subjects.forEach(s=>{if(s.exam){const t=s.time||'09:00',[hh,mm]=t.split(':').map(Number),e=pad(Math.min(23,hh+2))+':'+pad(mm);ev('ex'+s.id,s.exam,t,e,'Prüfung: '+s.name)}});
    L.push('END:VCALENDAR');dl('lernplan.ics',L.join('\r\n'),'text/calendar');toast('Kalender exportiert')},
  loadsample(){ask('Beispiel laden?','Dein aktueller Plan wird durch das Beispiel ersetzt. Mit Rückgängig kommst du zurück.','Laden',()=>{snap();const u=S.updated,k=S.ai;S=sample();S.updated=u;S.ai=k;save();toast('Beispiel geladen',true)})},
  fresh(){ask('Eigene Lernphase starten?','Alle Beispieldaten werden gelöscht. Danach legst du Lernphase und Fächer fest.','Leeren',()=>{snap();const k=S.ai;S=blank();S.ai=k;save();location.hash='faecher';setTimeout(settingsModal,60)})},
};
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return}
  const b=e.target.closest('[data-act]');if(!b)return;if(b.tagName==='INPUT'&&b.type==='checkbox'){}else e.preventDefault();ACT[b.dataset.act]?.(b,e)});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.imp!=null){impInfo(+el.dataset.imp);return}
  if(el.id==='fkS'){TM.s=el.value;render();return}
  if(el.dataset.tp){const s=sub(el.dataset.s),t=s&&s.topics.find(x=>x.id===el.dataset.tp);if(!t)return;snap();
    if(el.type==='checkbox'){t.done=el.checked;save();if(t.done&&!t.ratings.length)toast(t.name+' abgehakt – mit G / M / S bewerten, wie es sitzt',true)}
    else{const v=el.value.trim();if(v){t.name=v;save(true)}else el.value=t.name}return}
  if(el.dataset.s&&el.dataset.k){const s=sub(el.dataset.s);snap();let v=el.value;if(el.dataset.k==='ects'||el.dataset.k==='target')v=+v||0;if(el.dataset.k==='name'&&!v.trim())return;s[el.dataset.k]=v;
    if(el.dataset.k==='exam'&&v&&v>S.phase.end)S.phase.end=v;if(el.dataset.k==='exam'&&v&&v<S.phase.start)S.phase.start=v;save();return}
  if(el.dataset.res){const r=S.res.find(x=>x.id===el.dataset.res);snap();
    if(el.dataset.task!=null){const t=r.tasks[+el.dataset.task];t[el.dataset.k]=(el.dataset.k==='p'||el.dataset.k==='m')?(el.value===''?'':+el.value):el.value}
    else if(el.dataset.k==='done'){r.done=el.checked;r.doneAt=el.checked?TODAY():null}else r[el.dataset.k]=el.value;save()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#ov').classList.contains('on')){close();return}
  if(e.key==='Escape'&&!$('#aiP').hidden){ACT.aiclose();return}
  if(e.key==='Enter'&&e.target.dataset?.enter){e.preventDefault();ACT[e.target.dataset.enter]?.(e.target);return}
  if((e.metaKey||e.ctrlKey)&&e.key==='z'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){e.preventDefault();ACT.undo()}
});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')close()});
$('#aiF').addEventListener('submit',e=>{e.preventDefault();const t=$('#aiT'),v=t.value;t.value='';t.style.height='';aiSend(v)});
$('#aiT').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#aiF').requestSubmit()}});
$('#aiT').addEventListener('input',e=>{const t=e.target;t.style.height='';t.style.height=Math.min(140,t.scrollHeight)+'px'});
$('#impIn').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{impShow(JSON.parse(await f.text()),'Die Datei hat kein passendes Format.')}catch(err){impShow(null,'Die Datei konnte nicht gelesen werden.')}e.target.value=''});
$('#fileIn').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const x=migrate(JSON.parse(await f.text()));if(!Array.isArray(x.subjects))throw 0;snap();x.ai=S.ai;S=x;save();close();toast('Backup geladen',true)}catch(err){toast('Datei konnte nicht gelesen werden')}e.target.value=''});
window.addEventListener('hashchange',route);

S=load();route();connect();
}
</script>
</body>
</html>
